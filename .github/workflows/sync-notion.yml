name: Sync from Notion

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency: sync-notion

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read Notion and write data/movies.json
        run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain data/movies.json)" ]; then
            git config user.name "cinema-sync[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add data/movies.json
            git commit -m "Sync from Notion"
            git push
          else
            echo "No changes in Notion."
          fi
