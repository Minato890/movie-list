name: Sync from Notion

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab
    inputs:
      allow_shrink:
        description: "Allow replacing data with much less (only if you deleted a lot on purpose)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: sync-notion

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read Notion and write data/movies.json
        run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
      - name: Read MyAnimeList and write data/anime.json
        run: node scripts/sync-mal.mjs
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '' }}
        continue-on-error: true
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "cinema-sync[bot]"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "Sync from Notion"
            git push
          else
            echo "No changes in Notion."
          fi
